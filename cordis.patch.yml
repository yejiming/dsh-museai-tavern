# The dsh-museai-tavern bundle patch: activates the plugin as a profile layer.
#
# Two host rows: `museai` provides the settings service and opens the museai
# storage domain (works in every profile, headless included); `museai-routes`
# mounts the HTTP routes (/plugins/museai/*: models catalog, streaming chat,
# non-streaming completion, store/session persistence) and only activates
# where the webserver exists (web profiles) via nested inject. The browser
# half (lib/client.js) ships in the same package and loads under the museai
# id through the `dsh.client` declaration in package.json.
- insert:
    - id: museai
      name: '@yejiming/dsh-museai-tavern'
    - id: museai-routes
      name: '@yejiming/dsh-museai-tavern/routes'
